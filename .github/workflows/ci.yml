---
name: CI
on:
  push:
    branches:
    - master
    tags:
    - 'v*'
  pull_request:
permissions: {}
jobs:
  format:
    name: Format
    permissions:
      contents: read
    uses: ./.github/workflows/wc-format.yml
  reviewdog:
    name: Reviewdog
    permissions:
      actions: read
      checks: write
      contents: read
      pull-requests: write
    uses: ./.github/workflows/wc-reviewdog.yml
  fetch:
    name: Fetch
    permissions:
      contents: read
    uses: ./.github/workflows/wc-fetch.yml
  test:
    name: Test
    permissions:
      contents: read
    uses: ./.github/workflows/wc-test.yml
  coverage:
    name: Coverage
    permissions:
      contents: read
      actions: read
      pull-requests: write
    uses: ./.github/workflows/wc-coverage.yml
  build:
    name: Build
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/wc-build.yml
  release:
    needs:
    - format
    - reviewdog
    - test
    - build
    name: Release
    permissions:
      contents: write
    uses: ./.github/workflows/wc-release.yml
  ci:
    needs:
    - format
    - reviewdog
    - fetch
    - test
    - build
    - release
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: ${{ failure() || cancelled() }}
    steps:
    - name: Failure Status
      run: exit 1
